%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/nxp,tfa987x.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NXP/Goodix TFA9872/9873/9874 Audio Amplifiers

maintainers:
  - Mikkel Inumineq Jørgensen <6770514+inumineq@users.noreply.github.com>

description:
  Single-channel class-D audio amplifiers with an integrated boost converter,
  controlled over I2C and fed by a TDM or I2S stream. They are programmed
  directly over I2C; no firmware container is loaded.

allOf:
  - $ref: dai-common.yaml#

properties:
  compatible:
    enum:
      - nxp,tfa9872
      - nxp,tfa9873
      - nxp,tfa9874

  reg:
    maxItems: 1

  '#sound-dai-cells':
    const: 0

  reset-gpios:
    maxItems: 1
    description:
      Active-high reset line. The amplifier is held in reset while the line
      is asserted and must be released before the first register access.

  vddd-supply:
    description: regulator phandle for the VDDD power supply.

  sound-name-prefix: true

  sound-channel:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1]
    description:
      TDM slot the amplifier plays from, 0 for the left and 1 for the right
      channel of the attached stream.

required:
  - compatible
  - reg
  - '#sound-dai-cells'
  - vddd-supply

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
      #address-cells = <1>;
      #size-cells = <0>;

      audio-codec@34 {
        compatible = "nxp,tfa9874";
        reg = <0x34>;
        #sound-dai-cells = <0>;
        reset-gpios = <&tlmm 91 GPIO_ACTIVE_HIGH>;
        vddd-supply = <&vreg_s4a_1p8>;
        sound-channel = <0>;
        sound-name-prefix = "Top Speaker";
      };
    };
