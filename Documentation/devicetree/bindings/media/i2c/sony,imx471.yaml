%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/sony,imx471.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Sony IMX471 CMOS image sensor

maintainers:
  - Mikkel Inumineq <6770514+inumineq@users.noreply.github.com>

description:
  The IMX471 is a Sony CMOS image sensor controlled over I2C. Image data
  is transmitted over a four-lane MIPI CSI-2 D-PHY interface.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: sony,imx471

  reg:
    maxItems: 1

  clocks:
    description: External input clock (19.2 MHz)
    maxItems: 1

  avdd-supply:
    description: Analog power supply

  dvdd-supply:
    description: Digital core power supply

  dovdd-supply:
    description: Digital I/O power supply

  reset-gpios:
    description: Active-low sensor reset
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    unevaluatedProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            items:
              - const: 1
              - const: 2
              - const: 3
              - const: 4

        required:
          - data-lanes
          - link-frequencies

    required:
      - endpoint

required:
  - compatible
  - reg
  - clocks
  - avdd-supply
  - dvdd-supply
  - dovdd-supply
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@10 {
            compatible = "sony,imx471";
            reg = <0x10>;
            clocks = <&cam_clk>;
            avdd-supply = <&cam_avdd>;
            dvdd-supply = <&cam_dvdd>;
            dovdd-supply = <&cam_dovdd>;
            reset-gpios = <&gpio 78 GPIO_ACTIVE_LOW>;

            port {
                endpoint {
                    remote-endpoint = <&csi_in>;
                    data-lanes = <1 2 3 4>;
                    link-frequencies = /bits/ 64 <200000000>;
                };
            };
        };
    };
...
