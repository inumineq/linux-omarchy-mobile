%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/qcom,pm8150b-charger.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm PM8150B Switch-Mode Battery Charger "5"

maintainers:
  - Teguh Sobirin <teguh@sobir.in>

properties:
  compatible:
    const: qcom,pm8150b-charger

  reg:
    maxItems: 1

  interrupts:
    minItems: 4
    maxItems: 5

  interrupt-names:
    minItems: 4
    items:
      - const: usbin-plugin
      - const: bat-ov
      - const: wdog-bark
      - const: usbin-icl-change
      - const: usbin-src-change

  io-channels:
    items:
      - description: USB in current in uV of sense voltage
      - description: USB in voltage divided by 16

  io-channel-names:
    items:
      - const: usb_in_i_uv
      - const: usb_in_v_div_16

  monitored-battery: true

  power-supplies: true

  qcom,fuel-gauge:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Fuel gauge at the battery cell. When present, the driver charges by
      its readings with temperature-dependent limits and lets it decide
      when the battery is full.

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - io-channels
  - io-channel-names
  - monitored-battery

allOf:
  - $ref: power-supply.yaml#

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    pmic {
      #address-cells = <1>;
      #size-cells = <0>;

      charger@1000 {
        compatible = "qcom,pm8150b-charger";
        reg = <0x1000>;

        interrupts = <0x2 0x13 0x4 IRQ_TYPE_EDGE_BOTH>,
                     <0x2 0x12 0x2 IRQ_TYPE_EDGE_BOTH>,
                     <0x2 0x16 0x1 IRQ_TYPE_EDGE_RISING>,
                     <0x2 0x13 0x7 IRQ_TYPE_EDGE_RISING>,
                     <0x2 0x13 0x6 IRQ_TYPE_EDGE_RISING>;
        interrupt-names = "usbin-plugin", "bat-ov", "wdog-bark",
                          "usbin-icl-change", "usbin-src-change";

        io-channels = <&pm8150b_adc 7>, <&pm8150b_adc 8>;
        io-channel-names = "usb_in_i_uv", "usb_in_v_div_16";

        monitored-battery = <&battery>;
        qcom,fuel-gauge = <&fuel_gauge>;
      };
    };
